name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: stylua + luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned, not "latest": stylua's formatting rules shift between
          # releases and silently turn CI red on every push. Bump deliberately.
          version: v2.5.2
          args: --check .

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua plugin TESTS

  tests:
    name: Headless spec suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout diff.nvim
        uses: actions/checkout@v5
        with:
          path: diff.nvim

      # diff.nvim depends on lib.nvim at runtime (util/notify, util/validate).
      # The test runner picks it up via $LIB_NVIM_PATH (see TESTS/run.lua).
      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run spec suite
        working-directory: diff.nvim
        env:
          LIB_NVIM_PATH: ${{ github.workspace }}/lib.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          set +e
          nvim -n -i NONE --headless -u NONE \
            -c "set rtp+=." \
            -c "luafile TESTS/run.lua" \
            -c "qa!" > out.log 2>&1
          cat out.log
          grep -q DIFF_NVIM_TESTS_OK out.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # gitsuite.nvim checks this repo out as a CI dependency. Pointing it at
  # `main` means a broken commit here turns gitsuite red before anyone notices
  # it is this repo's fault. Publishes the commit that just passed stylua,
  # luacheck and the three-platform spec matrix as the `ci-verified` branch, so
  # consumers pinning `ref: ci-verified` always test a known-good commit.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards: two pushes can finish out of order,
      # and the older run must not overwrite the newer verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
          if [ -z "$tip" ]; then
            # First publish. A plain push creates the branch and is rejected if a
            # concurrent run created it first.
            git push origin HEAD:refs/heads/ci-verified
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
          case "$status" in
            behind | identical)
              echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
              ;;
            ahead | diverged)
              # The lease makes the server refuse the update if ci-verified moved since
              # the comparison, so an older run can never overwrite a newer one.
              git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip"
              ;;
            *)
              echo "::error::unexpected compare status '$status' for $tip...$SHA"
              exit 1
              ;;
          esac
